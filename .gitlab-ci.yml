stages:
  - test
  - deploy
  - code-quality

# ==================== TEST ====================
test:
  stage: test
  tags:
    - vm-runner
  script:
    - cd /home/student/HFXAIR/group01/flask_app
    - source /home/student/venv/bin/activate
    - pip install -r requirements.txt --quiet
    - pytest tests/ -v --tb=short
  only:
    - Test-ci/cd-pipeline
    - main

# ==================== DEPLOY ====================
deploy:
  stage: deploy
  tags:
    - vm-runner
  script:
    - cd /home/student/HFXAIR/group01
    - git fetch origin main
    - git reset --hard origin/main
    - sudo systemctl restart hfxair.service
    - echo "Deployment complete!"
  only:
    - Test-ci/cd-pipeline
    - main
  needs:
    - test

# ==================== CODE QUALITY ====================
run-dpy:
  stage: code-quality
  tags:
    - vm-runner
  script:
    - echo "Downloading DPy..."
    - cd /home/student
    - wget -q https://www.designite-tools.com/assets/DPy-linux.zip -O DPy.zip
    - unzip -o DPy.zip
    - chmod +x DPy
    - echo "Running DPy on flask_app..."
    - mkdir -p /home/student/HFXAIR/group01/smells/
    - ./DPy analyze -i /home/student/HFXAIR/group01/flask_app -o /home/student/HFXAIR/group01/smells/ -f csv
    - echo "DPy analysis complete!"
    - ls -la /home/student/HFXAIR/group01/smells/
  only:
    - Test-ci/cd-pipeline
    - main
  needs:
    - deploy

submit-dcode:
  stage: code-quality
  tags:
    - vm-runner
  script:
    - source /home/student/venv/bin/activate
    - pip install requests --quiet
    - python3 /home/student/HFXAIR/group01/.quality/push_to_dcode.py $DCODE_PROJECT_ID $DCODE_API_KEY /home/student/HFXAIR/group01/smells/ $CI_COMMIT_SHA
  only:
    - Test-ci/cd-pipeline
    - main
  needs:
    - run-dpy